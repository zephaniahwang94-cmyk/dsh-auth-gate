name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - if: runner.os == 'Linux'
        run: sh -n ./install.sh && ./install.sh --help
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref] $tokens,
            [ref] $errors
          ) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }

  clean-installer-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Provide isolated Harness CLI boundary
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nprintf "%%s\\n" "$*" > "$DSH_INSTALL_LOG"\n' > "$RUNNER_TEMP/bin/dsh"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/bin/pnpm"
          chmod +x "$RUNNER_TEMP/bin/dsh" "$RUNNER_TEMP/bin/pnpm"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run clean POSIX installer
        env:
          DSH_INSTALL_LOG: ${{ runner.temp }}/dsh-install.log
        run: ./install.sh --protection ApprovalLimit --profile smoke
      - name: Verify Harness bundle registration call
        env:
          DSH_INSTALL_LOG: ${{ runner.temp }}/dsh-install.log
        run: grep -F "plugin --profile smoke add $GITHUB_WORKSPACE" "$DSH_INSTALL_LOG"
